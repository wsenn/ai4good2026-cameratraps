# DeepFaune box model (lpft_crops_deepfaune_vitl14.yaml) at 336px input instead of 224 (NOT the
# 224px used everywhere else): most remaining crop errors are between similar species (margay vs
# ocelot, the two Mazama deer). Crops are 448px squares; full-frame fallbacks come from the 448px
# images. Gradient checkpointing for memory (no effect on results).

split: official_ood
seed: 0

model: vit_large_patch14_dinov2.lvd142m
pretrained: true
model_kwargs:
  img_size: 336              # timm resamples the position embedding once at load
  pretrained_cfg_overlay:
    file: /zfs/ai4good/groups/camera-traps/groupB/models/deepfaune/deepfaune_v1.3_vitl14_dinov2_backbone.safetensors

lr: 0.00001                  # one lr for backbone and probe head, as LP-FT
weight_decay: 0.05
wd_skip_1d: true
crops: crops_s448            # train: every box >= 0.6; val/test: the top box
lp_init: true               # LP stage before fine-tuning
lr_schedule: cosine
warmup_steps: 500
grad_clip: 1.0
grad_checkpointing: true    # no effect on results

min_per_camera: 10
min_cameras: 5

size: 336
height: 448                  # full-frame fallbacks from images_h448
image_dir: null
epochs: 10                    # as fast.yaml, so the ResNet rows compare directly
batch_size: 128

amp: true
num_workers: 8
device: null
verbose: true
pred_dir: results/preds
log_dir: logs

wandb: false
wandb_project: ai4good-iwildcam
